name: user-service CI

on:
  push:
    paths:
      - "apps/user-service/**"
  pull_request:
    paths:
      - "apps/user-service/**"

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/user-service
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: apps/user-service/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Docker build (smoke)
        run: docker build -t user-service:ci -f Dockerfile .
