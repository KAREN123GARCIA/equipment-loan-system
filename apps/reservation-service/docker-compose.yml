version: "3.8"

services:
  postgres-reservation:
    image: postgres:16
    container_name: postgres-reservation
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservation_db
    ports:
      - "5437:5432"
    volumes:
      - reservation_pgdata:/var/lib/postgresql/data
    networks:
      - equipment-loan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservation_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  reservation-service:
    build: .
    container_name: reservation-service
    env_file:
      - .env
    ports:
      - "3005:3005"
    depends_on:
      postgres-reservation:
        condition: service_healthy
    networks:
      - equipment-loan-network
    command: >
      sh -c "npx prisma migrate deploy || true; node dist/src/main.js"

volumes:
  reservation_pgdata:

networks:
  equipment-loan-network:
    external: true
