version: "3.8"

services:
  postgres-loan:
    image: postgres:16
    container_name: postgres-loan
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loan_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_loan_data:/var/lib/postgresql/data
    networks:
      - equipment-loan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loan_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  loan-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan-service
    env_file:
      - .env
    ports:
      - "3004:3004"
    networks:
      - equipment-loan-network
    depends_on:
      postgres-loan:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy || true;
             node $( [ -f dist/main.js ] && echo dist/main.js || echo dist/src/main.js )"

volumes:
  postgres_loan_data:

networks:
  equipment-loan-network:
    external: true
