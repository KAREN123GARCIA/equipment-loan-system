version: '3.8'
services:
  postgres-inv:
    image: postgres:16
    container_name: postgres-inv
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_inv_data:/var/lib/postgresql/data
    networks:
      - equipment-loan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-service
    env_file:
      - .env
    ports:
      - "3003:3003"
    networks:
      - equipment-loan-network
    depends_on:
      postgres-inv:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy || true; node dist/src/main.js"

volumes:
  postgres_inv_data:

networks:
  equipment-loan-network:
    external: true
