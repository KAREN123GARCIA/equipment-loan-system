version: '3.8'
services:
  postgres-loan:
    image: postgres:16
    container_name: postgres-loan
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loan_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_loan_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loan_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  loan-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan-service
    env_file:
      - .env
    ports:
      - "3004:3004"
    depends_on:
      postgres-loan:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy || true; node dist/src/main.js"

volumes:
  postgres_loan_data:
services:
  postgres-loans:
    image: postgres:16
    container_name: postgres-loans
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - loans_pgdata:/var/lib/postgresql/data

  loan-service:
    build: .
    container_name: loan-service
    env_file:
      - .env
    ports:
      - "3004:3004"
    depends_on:
      - postgres-loans

volumes:
  loans_pgdata:
