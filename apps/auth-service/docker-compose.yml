version: '3.8'
services:
  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - equipment-loan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    env_file:
      - .env
    ports:
      - "3002:3002"
    networks:
      - equipment-loan-network
    depends_on:
      postgres-auth:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy || true; node dist/src/main.js"

volumes:
  postgres_auth_data:

networks:
  equipment-loan-network:
    external: true